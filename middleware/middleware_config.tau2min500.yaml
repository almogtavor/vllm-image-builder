# tau2 middleware configuration, 500-token span floor (pass 2).
#
# The middleware is render-only: vLLM's render endpoint owns tokenization and
# chat-template rendering, and vLLM's /v1/chat/completions/parse owns response
# parsing. The middleware's only token work is padding each per-message chunk
# to a block boundary (for PIC span reuse).

# Host and port this middleware exposes.
server:
  host: "0.0.0.0"
  port: 9000

# The vLLM server this middleware renders/generates/parses against.
backend:
  base_url: "http://localhost:8000/v1"  # Overridden by VLLM_ADDRESS; set by the helm chart in-cluster.
  api_key: "vllm"
  timeout: 3600           # Must EXCEED the client's own wait, or the mw abandons the
                          # backend request first and vLLM decodes it to the window with
                          # nobody attached -- 2 such orphans on t2h1 held KV at 83 tok/s.
  model: "google/gemma-4-31B-it"        # Overridden by MODEL_NAME.

model:
  model_id: "google/gemma-4-31B-it"     # Overridden by MODEL_NAME.

processing:
  span_policy: tool_call_units  # tau2 tools are get_order_details/get_user_details, not bash/view,
                                # so tool_file_read would select ZERO spans here. tool_responses
                                # selects zero too, for a subtler reason: gemma-4's template renders
                                # a tool result INSIDE the assistant turn that called it, so the two
                                # are one boundary unit and a unit is a span only if every message
                                # in it is selected. This policy takes the pair. See span_policy.py.
  min_span_tokens: 500          # Only tool responses longer than this become spans.
  padding:
    pad_token_id: 27      # Pad token id (overridden by VLLM_V1_SPANS_PAD_TOKEN).
  warmup:
    enabled: true         # Prefill each per-message span before the real request
                          # (overridden by MIDDLEWARE_WARMUP_ENABLED).
    cache_size: 2048      # Per-worker LRU of already-warmed spans; skip re-warming.
                          # 0 disables dedup. (overridden by MIDDLEWARE_WARMUP_CACHE_SIZE)

logging:
  output_dir: "/tmp/middleware_logs"
  metrics:
    enabled: false
    format: "json"
    file_pattern: "metrics_{timestamp}.json"
  responses:
    enabled: true
    format: "json"
    file_pattern: "response_{request_id}.json"
