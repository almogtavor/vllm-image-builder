# Middleware config for the "min-500" span-floor sweep variant.
#
# Same as middleware_config.yaml EXCEPT the span policy is purely length-based:
# every message is a span CANDIDATE (all_messages), but a unit only becomes a PIC
# span if its real (unpadded) token length exceeds min_span_tokens (500).
#
# WHY 500: measured on the saved traces, the DEFAULT policy (tool_file_read, which
# declares every code-file read a span) produces spans with a median of just 35
# tokens -- 33% are smaller than a single 32-token KV block and so cannot be
# partially reused at all, 62% are <=64 tok and 78% are <=128 tok, meaning Gap-64
# and Gap-128 recompute the WHOLE span most of the time while still paying the
# middleware round-trip. That makes the gap length nearly meaningless. A 500-token
# floor keeps only spans large enough that partial recompute can actually save
# work, which is the regime where gap-32 / gap-64 / gap-128 should finally differ.

server:
  host: "0.0.0.0"
  port: 9000

backend:
  base_url: "http://localhost:8000/v1"  # Overridden by VLLM_ADDRESS; set by the helm chart in-cluster.
  api_key: "vllm"
  timeout: 900
  model: "google/gemma-4-31B-it"        # Overridden by MODEL_NAME.

model:
  model_id: "google/gemma-4-31B-it"     # Overridden by MODEL_NAME.

processing:
  span_policy: all_messages   # every message is a candidate; the length filter below decides.
  min_span_tokens: 500        # only units > 500 real tokens become spans.
  padding:
    pad_token_id: 27          # Pad token id (overridden by VLLM_V1_SPANS_PAD_TOKEN).
  warmup:
    enabled: true             # prime each (long) span before the real request.
    cache_size: 2048

logging:
  output_dir: "/tmp/middleware_logs"
  metrics:
    enabled: false
    format: "json"
    file_pattern: "metrics_{timestamp}.json"
  responses:
    enabled: true
    format: "json"
    file_pattern: "response_{request_id}.json"
